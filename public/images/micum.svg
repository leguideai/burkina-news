<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="micumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D30" />
      <stop offset="50%" stop-color="#087443" />
      <stop offset="100%" stop-color="#05331E" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <linearGradient id="micumCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#F46B18" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="micumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#micumBg)" stroke="#173C2B" stroke-width="2" />

  <!-- Outer Orbital Neural Ring -->
  <ellipse cx="32" cy="32" rx="20" ry="12" fill="none" stroke="url(#micumRing)" stroke-width="2" stroke-dasharray="6 3" transform="rotate(-25 32 32)" />
  <ellipse cx="32" cy="32" rx="20" ry="12" fill="none" stroke="url(#micumRing)" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(35 32 32)" />

  <!-- Neural Nodes -->
  <circle cx="16" cy="24" r="2" fill="#5EEAD4" />
  <circle cx="48" cy="40" r="2" fill="#5EEAD4" />
  <circle cx="46" cy="20" r="1.5" fill="#FFB347" />
  <circle cx="18" cy="44" r="1.5" fill="#FFB347" />

  <!-- Central Intelligence Diamond Star (Spark) -->
  <path d="M 32 14 C 32 24, 32 24, 42 32 C 32 32, 32 40, 32 50 C 32 40, 32 32, 22 32 C 32 24, 32 24, 32 14 Z" 
        fill="url(#micumCore)" 
        filter="url(#glow)" />

  <!-- Inner Diamond Center Core -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />

  <!-- Secondary Satellite Sparks -->
  <path d="M 45 16 C 45 19, 45 19, 48 21 C 45 21, 45 23, 45 26 C 45 23, 45 21, 42 21 C 45 19, 45 19, 45 16 Z" fill="#FFE3A8" />
  <path d="M 18 36 C 18 38, 18 38, 20 39 C 18 39, 18 41, 18 43 C 18 41, 18 39, 16 39 C 18 38, 18 38, 18 36 Z" fill="#5EEAD4" />
</svg>
